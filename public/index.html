<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b5d1e">
  <meta name="description" content="MeriDukaan - bolkar bikri, kharcha, stock aur munafa ka hisaab">
  <title>MeriDukaan</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1 class="logo">Meri<span>Dukaan</span></h1>
    <span id="offlineBadge" class="badge offline" hidden>● Offline - phone mein save</span>
    <label class="lang">
      <span class="sr">Bhasha / Language</span>
      <select id="lang" aria-label="Bhasha / Language">
        <option value="hi-IN">हिंदी</option>
        <option value="mr-IN">मराठी</option>
        <option value="ta-IN">தமிழ்</option>
        <option value="en-IN">English</option>
      </select>
    </label>
  </header>

  <main>
    <section class="voice" aria-label="Bolkar entry">
      <button id="mic" class="mic" type="button" aria-label="Bolne ke liye dabaiye">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a.9.9 0 1 0-1.8 0 4.2 4.2 0 0 1-8.4 0 .9.9 0 1 0-1.8 0 6 6 0 0 0 5.1 5.9V20H8.5a.9.9 0 0 0 0 1.8h7a.9.9 0 0 0 0-1.8h-2.6v-2.6a6 6 0 0 0 5.1-5.9z"/></svg>
      </button>
      <p id="micLabel" class="mic-label">Dabaiye aur boliye</p>
      <p id="noiseHint" class="hint">🔊 Shor hai? Phone munh ke paas rakhein · Noisy place? Move closer</p>

      <div class="line transcript" aria-live="polite">
        <span class="lbl">Aapne kaha</span>
        <span id="transcript" class="txt muted">—</span>
      </div>
      <div class="line reply" aria-live="assertive">
        <span class="lbl">MeriDukaan</span>
        <span id="reply" class="txt">Namaste! Mic dabakar boliye, jaise: "5 kilo chawal 300 rupaye mein beche"</span>
        <button id="replay" class="icon-btn" type="button" aria-label="Phir se suniye">🔁</button>
      </div>

      <div id="cards" class="cards" aria-live="polite"></div>

      <div id="quickPick" class="quick" hidden>
        <p class="quick-title">Tap karke chuniye</p>
        <div class="chips" id="quickTypes" role="group" aria-label="Entry type">
          <button type="button" data-type="sale" class="chip on">Bikri</button>
          <button type="button" data-type="purchase" class="chip">Maal aaya</button>
          <button type="button" data-type="expense" class="chip">Kharcha</button>
        </div>
        <div id="quickItems" class="grid"></div>
      </div>

      <form id="typeForm" class="type-form" autocomplete="off">
        <label class="sr" for="typeInput">Likhkar entry</label>
        <input id="typeInput" type="text" inputmode="text" placeholder="Ya yahan likhiye…" enterkeyhint="send">
        <button type="submit" class="btn primary">Bhejo</button>
      </form>

      <div class="shortcuts" role="group" aria-label="Jaldi sawaal">
        <button type="button" class="btn ghost" data-say="Aaj ka munafa kitna hua?">💰 Aaj ka munafa?</button>
        <button type="button" class="btn ghost" data-say="Pichhla hatao">↩ Pichhla hatao</button>
        <button type="button" class="btn ghost" data-say="Aaj ka hisaab">📒 Aaj ka hisaab</button>
      </div>
    </section>

    <nav class="tabs" role="tablist" aria-label="Hisaab">
      <button type="button" role="tab" data-tab="sales" class="tab on" aria-selected="true">Bikri<small>Sales</small></button>
      <button type="button" role="tab" data-tab="expenses" class="tab" aria-selected="false">Kharcha<small>Expenses</small></button>
      <button type="button" role="tab" data-tab="stock" class="tab" aria-selected="false">Stock<small>Maal</small></button>
      <button type="button" role="tab" data-tab="profit" class="tab" aria-selected="false">Munafa<small>Profit</small></button>
    </nav>
    <section id="panel" class="panel" role="tabpanel"></section>

    <section class="settings" aria-label="Settings">
      <h2>Dukaan settings</h2>
      <p id="shopName" class="muted"></p>
      <div class="row">
        <button id="setupBtn" type="button" class="btn">🏪 Dukaan setup (bolkar)</button>
        <button id="resetBtn" type="button" class="btn danger">Sample data wapas</button>
      </div>
      <p id="aiStatus" class="muted small"></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/data.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
