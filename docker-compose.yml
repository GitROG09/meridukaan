services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - sync
  sync:
    image: node:24-alpine
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      DATA_DIR: /data
      SECURE_COOKIES: "${SECURE_COOKIES:-false}"
    volumes:
      - ./server:/app:ro
      - shop-data:/data
    restart: unless-stopped

volumes:
  shop-data:
